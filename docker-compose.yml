services:
  db:
    image: postgres:16-alpine
    container_name: dansefest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-Dance-Fest-Local}
    ports:
      # Порт назовні — щоб можна було підключитися з WebStorm / DataGrip / psql.
      # 5433, а не 5432: 5432 зазвичай уже зайнятий локальним Postgres.
      - '${DB_EXTERNAL_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-Dance-Fest-Local}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: dansefest-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ці значення перекривають backend/.env: і @nestjs/config, і dotenv
      # не перетирають змінні, які вже є в оточенні процесу.
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-Dance-Fest-Local}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-change-me}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_REFRESH_EXPIRES_IN_SECONDS: ${JWT_REFRESH_EXPIRES_IN_SECONDS:-2592000}
      FRONTEND_URL: http://localhost:5173
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      # Анонімний том: node_modules залишаються тими, що зібрані в образі під
      # Linux. Без цього bind mount підсунув би збірку bcrypt з-під Windows.
      - /app/node_modules
    command: sh -c "npm run migrate && npm run start:dev"

  frontend:
    build: ./frontend
    container_name: dansefest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
