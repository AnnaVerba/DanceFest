services:
  db:
    image: postgres:16-alpine
    container_name: dansefest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-Dance-Fest-Local}
    ports:
      - '${DB_EXTERNAL_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-Dance-Fest-Local}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dansefest-redis
    restart: unless-stopped
    ports:
      - '${REDIS_EXTERNAL_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: dansefest-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-Dance-Fest-Local}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-change-me}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_REFRESH_EXPIRES_IN_SECONDS: ${JWT_REFRESH_EXPIRES_IN_SECONDS:-2592000}
      FRONTEND_URL: http://localhost:5173
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CompAdmin}
      OCP_REGION: ${OCP_REGION:-}
      OCP_ACCESS_KEY_ID: ${OCP_ACCESS_KEY_ID:-}
      OCP_SECRET_ACCESS_KEY: ${OCP_SECRET_ACCESS_KEY:-}
      OCP_BUCKET: ${OCP_BUCKET:-}
      OCP_PUBLIC_URL: ${OCP_PUBLIC_URL:-}
      OCP_ENDPOINT: ${OCP_ENDPOINT:-}
      OCP_IMAGES_PREFIX: ${OCP_IMAGES_PREFIX:-images}
      OCP_AUDIO_PREFIX: ${OCP_AUDIO_PREFIX:-audio}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run migrate && npm run start:dev"

  frontend:
    build: ./frontend
    container_name: dansefest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
  redisdata:
