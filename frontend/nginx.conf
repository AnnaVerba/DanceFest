server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Banner and music uploads go through the API.
    client_max_body_size 50m;

    location /api/ {
        # The trailing slash strips the /api prefix: /api/competitions -> /competitions.
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything under /assets, so it can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
